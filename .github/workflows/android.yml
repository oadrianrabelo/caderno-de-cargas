name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Também dá para publicar uma versão pelo celular: Actions → Android → Run workflow → informe a versão.
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar como Release (ex.: v0.1.0). Vazio = só compila.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache das dependências e do wrapper do Gradle.
      - uses: gradle/actions/setup-gradle@v4

      # Sem keystore nos secrets, o APK sai assinado com uma chave debug própria, gerada uma vez e guardada em
      # cache, para manter a mesma assinatura entre builds (best effort: o GitHub apaga caches sem uso por 7 dias).
      - name: Chave debug estável
        uses: actions/cache@v4
        with:
          path: ~/caderno-debug.keystore
          key: caderno-debug-keystore-v2

      - name: Gera a chave debug se não veio do cache
        run: |
          if [ ! -f "$HOME/caderno-debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/caderno-debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Caderno de Cargas Debug,O=Android,C=BR"
          fi
          echo "DEBUG_KEYSTORE_PATH=$HOME/caderno-debug.keystore" >> "$GITHUB_ENV"

      # A keystore só existe nos secrets do repositório. Sem ela, o CI gera um APK debug.
      - name: Prepara assinatura e versão
        id: prep
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_VERSAO: ${{ github.event.inputs.versao }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: gerando APK debug (assinatura do cache, que o GitHub pode apagar). Cadastre a keystore nos secrets para ter assinatura permanente."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_VERSAO}"; fi
          if [ -n "$TAG" ]; then
            case "$TAG" in v[0-9]*) ;; *) echo "::error::A versão precisa começar com v e um número, ex.: v0.1.0"; exit 1;; esac
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # version.json vai dentro do APK; web-<build>-<nativo>.json é o pacote da atualização automática.
      - name: Gera o pacote web da atualização automática
        run: node scripts/web-bundle.js "v${VERSION_NAME}" "${GITHUB_RUN_NUMBER}" dist

      - name: Copia o app web para o projeto Android
        run: npx cap sync android

      - name: Compila o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            # Só dois secrets são obrigatórios: a keystore (base64) e a senha. Apelido e senha da chave têm padrão.
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-caderno}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ./gradlew --no-daemon assembleRelease
          else
            # Assina o debug com a chave fixa do cache, sem mudar o projeto Android (que entra no hash nativo).
            ./gradlew --no-daemon assembleDebug \
              -Pandroid.injected.signing.store.file="$DEBUG_KEYSTORE_PATH" -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          fi
          apk=$(ls app/build/outputs/apk/$BUILD_TYPE/*.apk | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/caderno-de-cargas-${VERSION_NAME}-${BUILD_TYPE}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      # O SHA-1 do certificado é público e é o que o Google Cloud pede para liberar o login do Drive.
      - name: Mostra o certificado do APK
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$bt/apksigner" verify --print-certs dist/*.apk | grep -E 'SHA-1|SHA-256')
          echo "$certs"
          { echo "### Certificado do APK ($BUILD_TYPE)"; echo '```'; echo "$certs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: caderno-de-cargas-apk
          path: |
            dist/*.apk
            dist/web-*.json
          if-no-files-found: error

  # Teste de fumaça num emulador Android de verdade (só ao publicar): instala, abre, atalho, voltar,
  # descanso com alarme e notificação. A Release só sai se ele passar.
  emulador:
    needs: apk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caderno-de-cargas-apk
          path: dist
      - name: Liga a aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh "$(ls dist/*.apk | head -1)" emulador
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: emulador
          if-no-files-found: ignore

  release:
    needs: [apk, emulador]
    if: needs.apk.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caderno-de-cargas-apk
          path: dist
      - name: Anexa o APK à Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.apk.outputs.tag }}
        run: |
          # Sem a tag, o gh cria a tag no commit compilado.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Caderno de Cargas $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" dist/*.apk dist/web-*.json --clobber
