name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Também dá para publicar uma versão pelo celular: Actions → Android → Run workflow → informe a versão.
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar como Release (ex.: v0.1.0). Vazio = só compila.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache das dependências e do wrapper do Gradle.
      - uses: gradle/actions/setup-gradle@v4

      - name: Copia o app web para o projeto Android
        run: npx cap sync android

      # A keystore só existe nos secrets do repositório. Sem ela, o CI gera um APK debug.
      - name: Prepara assinatura e versão
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_VERSAO: ${{ github.event.inputs.versao }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: gerando APK debug. Cada build debug do CI tem uma assinatura diferente, então atualizar exige desinstalar."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_VERSAO}"; fi
          if [ -n "$TAG" ]; then
            case "$TAG" in v[0-9]*) ;; *) echo "::error::A versão precisa começar com v e um número, ex.: v0.1.0"; exit 1;; esac
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compila o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          apk=$(ls app/build/outputs/apk/$BUILD_TYPE/*.apk | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/caderno-de-cargas-${VERSION_NAME}-${BUILD_TYPE}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      # O SHA-1 do certificado é público e é o que o Google Cloud pede para liberar o login do Drive.
      - name: Mostra o certificado do APK
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$bt/apksigner" verify --print-certs dist/*.apk | grep -E 'SHA-1|SHA-256')
          echo "$certs"
          { echo "### Certificado do APK ($BUILD_TYPE)"; echo '```'; echo "$certs"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: caderno-de-cargas-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Anexa o APK à Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem a tag, o gh cria a tag no commit compilado.
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Caderno de Cargas $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.apk --clobber
