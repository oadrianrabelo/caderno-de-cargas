<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Caderno de Cargas</title>
<style>
:root {
  --bg: #eceff2; --card: #ffffff; --ink: #14191f; --mute: #5d6773; --line: #d5dae0;
  --accent: #1f4fd8; --accent-ink: #ffffff; --done: #1d7f4e; --done-bg: #e1f3e9; --field: #f5f7f9; --danger: #b3261e;
  --f-display: "Roboto Condensed", "Arial Narrow", sans-serif-condensed, system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1217; --card: #171d24; --ink: #eaeef2; --mute: #96a1ad; --line: #2a323b; --accent: #7b9cff; --accent-ink: #0b1020; --done: #5fd593; --done-bg: #123325; --field: #1e252d; --danger: #ff8a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--f-body); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 560px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 9; background: var(--bg); padding: max(12px, env(safe-area-inset-top, 0px)) 0 10px; border-bottom: 1px solid var(--line); }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 15px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.week { display: flex; align-items: center; gap: 4px; }
.week button { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; font: 600 20px/1 var(--f-body); cursor: pointer; }
.week button:disabled { opacity: .35; }
.week .wl { min-width: 96px; text-align: center; font: 700 22px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.tab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
@media (max-width: 400px) { .tab { font-size: 16px; letter-spacing: .03em; } }
.tabs.small .tab { font-size: 14px; letter-spacing: .02em; }
.tab .dot.skip { background: var(--mute); }
.note { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--line); color: var(--mute); border-radius: 8px; font-size: 14px; }
.tab { position: relative; height: 46px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; font: 700 18px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab .dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 0 10px; }
.head h1 { margin: 0; font: 700 30px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.sub { color: var(--mute); font-size: 14px; }
.prog { font: 600 14px/1 var(--f-body); color: var(--mute); font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 14px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--done); transition: width .2s; }
.list { display: flex; flex-direction: column; gap: 12px; }
.ex { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; min-width: 0; }
.exh { display: flex; gap: 12px; align-items: flex-start; }
.idx { flex: none; width: 28px; height: 28px; border-radius: 6px; background: var(--field); color: var(--mute); display: grid; place-items: center; font: 700 16px/1 var(--f-display); }
.exn { min-width: 0; flex: 1; }
.exn h2 { margin: 0; font: 600 18px/1.2 var(--f-body); overflow-wrap: anywhere; }
.meta { margin-top: 3px; color: var(--mute); font-size: 14px; font-variant-numeric: tabular-nums; }
.swap { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px 40px; }
.chip { border: 1px solid var(--line); background: var(--field); color: var(--mute); border-radius: 999px; padding: 6px 11px; font: 500 13px/1.2 var(--f-body); cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: transparent; font-weight: 600; }
.sets { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.set { display: grid; grid-template-columns: 30px 1fr 14px 1fr 52px; gap: 8px; align-items: center; }
.sl { font: 700 16px/1 var(--f-display); color: var(--mute); text-align: center; letter-spacing: .04em; }
.fld { position: relative; }
.fld input { width: 100%; height: 52px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px; padding: 0 30px 0 12px; font: 600 22px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.fld input::placeholder { color: var(--mute); opacity: .55; font-weight: 500; }
.fld small { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--mute); font-size: 12px; pointer-events: none; }
.x { text-align: center; color: var(--mute); font-weight: 600; }
.ck { height: 52px; width: 52px; border: 1px solid var(--line); background: var(--card); color: var(--mute); border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ck svg { width: 24px; height: 24px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.set.done .ck { background: var(--done-bg); border-color: var(--done); color: var(--done); }
.set.done input { border-color: var(--done); }
.tip { margin: 14px 0 0; color: var(--mute); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; font: 600 14px/1 var(--f-body); cursor: pointer; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--danger); }
.foot { margin-top: 12px; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.warn { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; font-size: 14px; }
.ed { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.ed .nm { width: 100%; height: 48px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px; padding: 0 12px; font: 600 17px/1 var(--f-body); }
.ed .r2 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: end; }
.ed label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); min-width: 0; }
.ed label input { height: 44px; width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px; padding: 0 10px; font: 600 16px/1 var(--f-body); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; font: 700 20px/1 var(--f-body); cursor: pointer; }
.step b { min-width: 22px; text-align: center; font: 700 20px/1 var(--f-display); }
.ed .r3 { display: flex; gap: 8px; flex-wrap: wrap; }
.ed .r3 .btn { min-height: 40px; }
.edtop { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.ttl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 6px; padding: 5px 9px; font: 600 13px/1.2 var(--f-body); cursor: pointer; text-align: left; }
.tag.tec { border-color: var(--accent); color: var(--accent); background: transparent; }
.det { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 40px; }
.sl .tq { display: block; margin-top: 3px; font: 700 9px/1 var(--f-body); letter-spacing: 0; color: var(--accent); text-transform: uppercase; }
.set.warm .sl { font-size: 13px; }
.set.warm .fld input { height: 44px; font-size: 18px; background: transparent; border-style: dashed; }
.wlab { margin: 2px 0 -2px; color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.ed select { height: 44px; width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 8px; padding: 0 8px; font: 600 15px/1 var(--f-body); }
.tipov { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.tipbox { width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; background: var(--card); color: var(--ink); border-radius: 14px; padding: 18px; }
.tipbox h2 { margin: 0 0 8px; font: 700 22px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.tipbox h3 { margin: 14px 0 4px; font-size: 15px; }
.tipbox p { margin: 0 0 8px; color: var(--mute); line-height: 1.45; }
.tipbox .btn { width: 100%; margin-top: 10px; }
@media (max-width: 380px) { .set { grid-template-columns: 24px 1fr 10px 1fr 48px; gap: 6px; } .ck { width: 48px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row1">
      <div class="brand">Caderno de Cargas</div>
      <div class="week">
        <button id="wprev" aria-label="Semana anterior">‹</button>
        <div class="wl" id="wl">Semana 1</div>
        <button id="wnext" aria-label="Próxima semana">›</button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>
  <main>
    <div class="head">
      <div class="ttl"><h1 id="title">Upper</h1><button class="tag" id="focus" type="button" hidden></button></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="note" id="skipnote" hidden></div>
    <div id="edtop" class="edtop" hidden></div>
    <div class="list" id="list"></div>
    <p class="tip" id="tip">Toque no ✓ com os campos vazios para repetir o que você fez da última vez. Os números cinza são o treino anterior.</p>
    <div class="tools">
      <button class="btn" id="bedit" type="button">Editar treino</button>
      <button class="btn" id="bskip" type="button">Pular treino</button>
      <button class="btn" id="bexp" type="button">Exportar backup</button>
      <button class="btn" id="bimp" type="button">Importar backup</button>
      <input type="file" id="fimp" accept=".json,application/json" hidden>
    </div>
    <div class="warn" id="warn" hidden>Este navegador não está guardando dados. Use "Exportar backup" depois de cada treino.</div>
    <div class="foot"><span id="sub"></span><span id="status"></span></div>
  </main>
</div>

// Programa embutido (Jeff Nippard). ORDER, NAMES, FOCUS e WEEKS são do programa em uso (ver applyProgram).
const BTS = {
  name: 'Jeff Nippard · Bodybuilding Transformation System', weeks: 12,
  order: ['upper', 'lower', 'pull', 'push', 'legs'],
  names: { upper: 'Upper', lower: 'Lower', pull: 'Pull', push: 'Push', legs: 'Legs' },
  focus: { upper: 'Foco em força', lower: 'Foco em força', pull: 'Foco em hipertrofia', push: 'Foco em hipertrofia', legs: 'Foco em hipertrofia' }
};
let ORDER = BTS.order, NAMES = BTS.names, FOCUS = BTS.focus, WEEKS = BTS.weeks, prog = null;
const $ = (id) => document.getElementById(id);
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const parse = CG.parse;

let logs = parse(LS.get('cg:logs'), {});
let custom = parse(LS.get('cg:custom'), {});
// Programas próprios: { active: id | undefined, list: { id: { id, name, weeks, days: [{ id, name, ex: [...] }] } } }.
let programs = parse(LS.get('cg:programs'), {});
let week = 1, day = 'upper', editing = false, saveTimer = null;
const storageOk = LS.set('cg:probe', '1');

function setStatus(t) { $('status').textContent = t; }
function persist() {
  const ok = LS.set('cg:logs', JSON.stringify(logs)) && LS.set('cg:custom', JSON.stringify(custom)) && LS.set('cg:programs', JSON.stringify(programs));
  setStatus(ok ? 'Salvo' : 'Não consegui salvar');
  $('warn').hidden = ok;
  if (ok) CGApp.saved.forEach((f) => { try { f(); } catch (e) { /* extensão opcional */ } });
}
function applyBackup(text) {
  const o = CG.parseBackup(text);
  if (!o) return false;
  logs = o.logs; custom = o.custom;
  if (o.programs) programs = o.programs; // backups antigos não têm programas: mantém os do aparelho
  applyProgram(); flushNow(); pickStart(); render();
  return true;
}
function applyProgram() {
  prog = (programs.active && programs.list && programs.list[programs.active]) || null;
  if (prog) {
    ORDER = prog.days.map((d) => d.id); NAMES = {}; FOCUS = {}; WEEKS = prog.weeks;
    prog.days.forEach((d) => { NAMES[d.id] = d.name; });
  } else {
    ORDER = BTS.order; NAMES = BTS.names; FOCUS = BTS.focus; WEEKS = BTS.weeks;
  }
  if (week > WEEKS) week = WEEKS;
  if (ORDER.indexOf(day) < 0) day = ORDER[0];
}
const progDay = () => prog.days.find((d) => d.id === day);
// Ponte para os scripts opcionais (native.js, sync.js). Sem eles o app funciona igual.
const CGApp = window.CGApp = {
  saved: [],
  snapshot: () => CG.serializeBackup(logs, custom, programs),
  restore: applyBackup,
  // render() já cria o treino do dia vazio (t = 0); só conta o que foi preenchido.
  isEmpty: () => !Object.keys(custom).length && !Object.keys(programs.list || {}).length && Object.values(logs).every((l) => !l || !l.t),
  status: (t) => setStatus(t),
  flush: () => flushNow(),
  // Usados por progress.js e programs.js.
  view: () => ({ logs, week, day, ORDER, NAMES, WEEKS, program: prog ? prog.name : BTS.name, list: getList(), doc: logs[ckey()] || null }),
  bts: () => ({ P, order: BTS.order, names: BTS.names, weeks: BTS.weeks, name: BTS.name }),
  programs: () => programs,
  // keep: só renomeou/editou o programa em uso, então fica no mesmo dia.
  setPrograms(p, edit, keep) { programs = p; applyProgram(); if (!keep) pickStart(); editing = !!edit; flushNow(); render(); if (!keep) scrollTo(0, 0); },
  go(w, d) { week = w; day = d; editing = false; render(); scrollTo(0, 0); }
};
function schedule() { setStatus('Salvando…'); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); }
function flushNow() { clearTimeout(saveTimer); persist(); }
addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); });

function baseList(w, d) { return CG.baseList(P, w, d); }
const ckey = () => week + '-' + day;
// No programa próprio, a lista do dia é a mesma em todas as semanas e é editada direto no programa.
function getList() { return custom[ckey()] || (prog ? progDay().ex : baseList(week, day)); }
function editList() { return prog ? custom[ckey()] || progDay().ex : CG.editList(custom, P, week, day); }

function getDoc() {
  const k = ckey();
  if (!logs[k]) {
    const d = new Date();
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    logs[k] = { week, day, date: iso, t: 0, ex: {} };
  }
  return logs[k];
}
function getEx(doc, id, name) { if (!doc.ex[id]) doc.ex[id] = { used: name, sets: {} }; return doc.ex[id]; }
function touch(doc) { doc.t = Date.now(); schedule(); }

function lastFor(name, exceptKey) { return CG.lastFor(logs, name, exceptKey); }

function progress() {
  const list = getList(), doc = getDoc();
  let total = 0, done = 0;
  list.forEach((ex) => {
    total += ex.s;
    const e = doc.ex[ex.id];
    if (e) for (let s = 0; s < ex.s; s++) if (e.sets[s] && e.sets[s].done) done++;
  });
  $('prog').textContent = done + ' de ' + total + ' séries';
  $('barfill').style.width = (total ? (done / total) * 100 : 0) + '%';
}

function renderTabs() {
  const tabs = $('tabs');
  tabs.textContent = '';
  tabs.style.gridTemplateColumns = 'repeat(' + ORDER.length + ', minmax(0, 1fr))';
  tabs.classList.toggle('small', ORDER.length > 5 || ORDER.some((d) => NAMES[d].length > 6));
  ORDER.forEach((d) => {
    const b = mk('button', 'tab', NAMES[d]);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(d === day));
    const lg = logs[week + '-' + d];
    const st = CG.dayStatus(lg);
    if (st) b.appendChild(mk('span', st === 'skip' ? 'dot skip' : 'dot'));
    b.title = NAMES[d];
    b.addEventListener('click', () => { day = d; render(); scrollTo(0, 0); });
    tabs.appendChild(b);
  });
}

function setRow(ex, i, s, used, last, doc, det) {
  const cur = (doc.ex[ex.id] && doc.ex[ex.id].sets[s]) || {};
  const lastSet = last ? (last[s] || last[Object.keys(last).pop()]) : null;
  const row = mk('div', 'set' + (cur.done ? ' done' : ''));
  const sl = mk('div', 'sl', 'S' + (s + 1));
  // Última série com técnica de intensidade: mostra o nome curto embaixo do número.
  if (s === ex.s - 1 && det && det.tec && CGTips.TECH[det.tec]) sl.appendChild(mk('span', 'tq', CGTips.TECH[det.tec].short));
  row.appendChild(sl);

  const f1 = mk('div', 'fld'), kg = mk('input');
  kg.type = 'number'; kg.inputMode = 'decimal'; kg.step = '0.5'; kg.min = '0'; kg.value = cur.kg || '';
  kg.placeholder = lastSet && lastSet.kg ? String(lastSet.kg) : '0';
  kg.setAttribute('aria-label', 'Carga, série ' + (s + 1) + ', ' + used);
  f1.appendChild(kg); f1.appendChild(mk('small', null, 'kg'));

  const f2 = mk('div', 'fld'), rp = mk('input');
  rp.type = 'number'; rp.inputMode = 'numeric'; rp.step = '1'; rp.min = '0'; rp.value = cur.reps || '';
  rp.placeholder = lastSet && lastSet.reps ? String(lastSet.reps) : '0';
  rp.setAttribute('aria-label', 'Repetições, série ' + (s + 1) + ', ' + used);
  f2.appendChild(rp); f2.appendChild(mk('small', null, 'rep'));

  const ck = mk('button', 'ck'); ck.type = 'button'; ck.innerHTML = CHECK;
  ck.setAttribute('aria-label', 'Marcar série ' + (s + 1) + ' como feita');
  ck.setAttribute('aria-pressed', String(!!cur.done));

  const write = (patch) => {
    const e = getEx(doc, ex.id, ex.n);
    e.used = used;
    e.sets[s] = Object.assign({ kg: '', reps: '', done: false }, e.sets[s], patch);
    touch(doc); progress();
  };
  kg.addEventListener('input', () => write({ kg: kg.value }));
  rp.addEventListener('input', () => write({ reps: rp.value }));
  ck.addEventListener('click', () => {
    const now = (doc.ex[ex.id] && doc.ex[ex.id].sets[s]) || {};
    if (!now.done) {
      if (!kg.value && lastSet && lastSet.kg) kg.value = lastSet.kg;
      if (!rp.value && lastSet && lastSet.reps) rp.value = lastSet.reps;
    }
    const nd = !now.done;
    write({ kg: kg.value, reps: rp.value, done: nd });
    row.classList.toggle('done', nd);
    ck.setAttribute('aria-pressed', String(nd));
    renderTabs();
  });
  row.append(f1, mk('div', 'x', '×'), f2, ck);
  return row;
}

// Série de aquecimento: só carga e repetições, não conta no progresso nem na "última carga".
function warmRow(ex, a, used, doc) {
  const cur = (doc.ex[ex.id] && doc.ex[ex.id].warm && doc.ex[ex.id].warm[a]) || {};
  const row = mk('div', 'set warm');
  row.appendChild(mk('div', 'sl', 'A' + (a + 1)));
  const write = (patch) => {
    const e = getEx(doc, ex.id, ex.n);
    e.used = used;
    e.warm = e.warm || {};
    e.warm[a] = Object.assign({ kg: '', reps: '' }, e.warm[a], patch);
    touch(doc);
  };
  const f1 = mk('div', 'fld'), kg = mk('input');
  kg.type = 'number'; kg.inputMode = 'decimal'; kg.step = '0.5'; kg.min = '0'; kg.value = cur.kg || ''; kg.placeholder = '0';
  kg.setAttribute('aria-label', 'Carga, aquecimento ' + (a + 1) + ', ' + used);
  f1.append(kg, mk('small', null, 'kg'));
  const f2 = mk('div', 'fld'), rp = mk('input');
  rp.type = 'number'; rp.inputMode = 'numeric'; rp.step = '1'; rp.min = '0'; rp.value = cur.reps || ''; rp.placeholder = '0';
  rp.setAttribute('aria-label', 'Repetições, aquecimento ' + (a + 1) + ', ' + used);
  f2.append(rp, mk('small', null, 'rep'));
  kg.addEventListener('input', () => write({ kg: kg.value }));
  rp.addEventListener('input', () => write({ reps: rp.value }));
  row.append(f1, mk('div', 'x', '×'), f2, mk('div'));

// Etiquetas de aquecimento, RPE e técnica; tocar abre a dica.
function detailTags(det) {
  const box = mk('div', 'det');
  const tag = (txt, key, cls) => { const b = mk('button', 'tag' + (cls ? ' ' + cls : ''), txt + ' ⓘ'); b.type = 'button'; b.addEventListener('click', () => CGTips.show(key)); box.appendChild(b); };

  nm.addEventListener('input', () => {
    ex.n = nm.value;
    const e = getDoc().ex[ex.id];
    if (e) e.used = nm.value;
    schedule();
  });
  box.appendChild(nm);

  const r2 = mk('div', 'r2');
  const lab1 = mk('label'); lab1.appendChild(document.createTextNode('Séries'));
  const st = mk('div', 'step');
  const mn = mk('button', null, '−'), val = mk('b', null, String(ex.s)), pl = mk('button', null, '+');
  mn.type = 'button'; pl.type = 'button';
  mn.setAttribute('aria-label', 'Menos uma série'); pl.setAttribute('aria-label', 'Mais uma série');
  mn.addEventListener('click', () => { if (ex.s > 1) { ex.s--; schedule(); render(); } });
  pl.addEventListener('click', () => { if (ex.s < 8) { ex.s++; schedule(); render(); } });
  st.append(mn, val, pl); lab1.appendChild(st);
  const lab2 = mk('label'); lab2.appendChild(document.createTextNode('Repetições'));
  const rr = mk('input'); rr.type = 'text'; rr.value = ex.r; rr.addEventListener('input', () => { ex.r = rr.value; schedule(); });
  lab2.appendChild(rr);
  const lab3 = mk('label'); lab3.appendChild(document.createTextNode('Descanso'));
  const tt = mk('input'); tt.type = 'text'; tt.value = ex.t; tt.addEventListener('input', () => { ex.t = tt.value; schedule(); });
  lab3.appendChild(tt);
  r2.append(lab1, lab2, lab3);
  box.appendChild(r2);

  // Aquecimento, RPE e técnica (começam com os valores do programa, se houver).
  const det = CG.exDetails(ex, window.BTS_EXTRA, week, day);
  const r4 = mk('div', 'r2');
  const lab4 = mk('label'); lab4.appendChild(document.createTextNode('Aquecimento'));
  const st2 = mk('div', 'step');
  const aq = det.aq || 0;
  const mn2 = mk('button', null, '−'), val2 = mk('b', null, String(aq)), pl2 = mk('button', null, '+');
  mn2.type = 'button'; pl2.type = 'button';
  mn2.setAttribute('aria-label', 'Menos uma série de aquecimento'); pl2.setAttribute('aria-label', 'Mais uma série de aquecimento');
  mn2.addEventListener('click', () => { if (aq > 0) { ex.aq = aq - 1; schedule(); render(); } });
  pl2.addEventListener('click', () => { if (aq < 5) { ex.aq = aq + 1; schedule(); render(); } });
  st2.append(mn2, val2, pl2); lab4.appendChild(st2);
  const field = (label, key, ph) => {
    const l = mk('label'); l.appendChild(document.createTextNode(label));
    const inp = mk('input'); inp.type = 'text'; inp.value = det[key] || ''; inp.placeholder = ph;
    inp.addEventListener('input', () => { ex[key] = inp.value.trim(); schedule(); });
    l.appendChild(inp);
    return l;
  };
  r4.append(lab4, field('RPE séries', 'rpe', 'ex.: 7-8'), field('RPE última', 'rpeUlt', 'ex.: 9-10'));
  box.appendChild(r4);
  const lab5 = mk('label'); lab5.appendChild(document.createTextNode('Técnica da última série'));
  const sel = mk('select'); sel.setAttribute('aria-label', 'Técnica da última série');
  [['', 'Nenhuma']].concat(Object.keys(CGTips.TECH).map((k) => [k, CGTips.TECH[k].name])).forEach(([v, t]) => {
    const o = mk('option', null, t); o.value = v; o.selected = (det.tec || '') === v; sel.appendChild(o);
  });
  sel.addEventListener('change', () => { ex.tec = sel.value; schedule(); });
  lab5.appendChild(sel);
  box.appendChild(lab5);

  const r3 = mk('div', 'r3');
  const up = mk('button', 'btn', '↑ Subir'), dn = mk('button', 'btn', '↓ Descer'), rm = mk('button', 'btn dng', 'Remover');
  [up, dn, rm].forEach((b) => { b.type = 'button'; });
  up.disabled = i === 0; dn.disabled = i === list.length - 1;
  up.addEventListener('click', () => { list.splice(i - 1, 0, list.splice(i, 1)[0]); schedule(); render(); });
  dn.addEventListener('click', () => { list.splice(i + 1, 0, list.splice(i, 1)[0]); schedule(); render(); });
  let armed = false, tm = null;
  rm.addEventListener('click', () => {
    if (!armed) { armed = true; rm.textContent = 'Toque de novo para remover'; tm = setTimeout(() => { armed = false; rm.textContent = 'Remover'; }, 3000); return; }
    clearTimeout(tm); list.splice(i, 1); schedule(); render();
  });
  r3.append(up, dn, rm);
  box.appendChild(r3);
  return box;
}

function renderList() {
  const listEl = $('list');
  listEl.textContent = '';
  const doc = getDoc(), k = ckey();
  const list = editing ? editList() : getList();
  list.forEach((ex, i) => {
    const used = (doc.ex[ex.id] && doc.ex[ex.id].used) || ex.n;
    const card = mk('section', 'ex');
    const h = mk('div', 'exh');
    h.appendChild(mk('div', 'idx', String(i + 1)));
    const nmBox = mk('div', 'exn');
    if (!editing) nmBox.appendChild(mk('h2', null, used));
    nmBox.appendChild(mk('div', 'meta', ex.s + ' séries · ' + ex.r + ' reps · descanso ' + ex.t));
    h.appendChild(nmBox);
    card.appendChild(h);

    if (editing) { card.appendChild(editor(ex, i, list)); listEl.appendChild(card); return; }

    if (ex.a && ex.a.length) {
      const sw = mk('div', 'swap');
      [ex.n].concat(ex.a).forEach((opt) => {
        const c = mk('button', 'chip', opt); c.type = 'button';
        c.setAttribute('aria-pressed', String(opt === used));
        c.addEventListener('click', () => { const e = getEx(doc, ex.id, ex.n); e.used = opt; touch(doc); renderList(); });
        sw.appendChild(c);
      });
      card.appendChild(sw);
    }
    const det = CG.exDetails(ex, window.BTS_EXTRA, week, day);
    const tags = detailTags(det);
    if (tags) card.appendChild(tags);
    const last = lastFor(used, k);
    const sets = mk('div', 'sets');
    if (det.aq) {
      sets.appendChild(mk('div', 'wlab', 'Aquecimento'));
      for (let a = 0; a < det.aq; a++) sets.appendChild(warmRow(ex, a, used, doc));
      sets.appendChild(mk('div', 'wlab', 'Séries válidas'));
    }
    for (let s = 0; s < ex.s; s++) sets.appendChild(setRow(ex, i, s, used, last, doc, det));
    card.appendChild(sets);
    listEl.appendChild(card);
  });
  if (!editing && !list.length) listEl.appendChild(mk('p', 'tip', 'Este dia ainda não tem exercícios. Toque em "Editar treino" para adicionar.'));
  if (editing) {
    const add = mk('button', 'btn pri', '+ Adicionar exercício'); add.type = 'button';
    add.addEventListener('click', () => { list.push({ id: 'n' + Date.now(), n: 'Novo exercício', s: 2, r: '8-12', t: '2 min', a: [] }); schedule(); render(); });
    listEl.appendChild(add);
  }
}

function renderEdTop() {
  const t = $('edtop');
  t.textContent = '';
  t.hidden = !editing;
  if (!editing) return;
  if (prog && !custom[ckey()]) { t.appendChild(mk('p', 'tip', 'As mudanças valem para todas as semanas de "' + prog.name + '".')); return; }
  const rep = mk('button', 'btn', 'Repetir nas próximas semanas'); rep.type = 'button';
  rep.addEventListener('click', () => {
    CG.copyToNextWeeks(custom, editList(), week, day, WEEKS);
    schedule(); setStatus(week < WEEKS ? 'Copiado para as semanas ' + (week + 1) + ' a ' + WEEKS : 'Já é a última semana');
  });
  const res = mk('button', 'btn dng', 'Restaurar original'); res.type = 'button';
  let armed = false, tm = null;
  res.addEventListener('click', () => {
    if (!armed) { armed = true; res.textContent = 'Toque de novo para restaurar'; tm = setTimeout(() => { armed = false; res.textContent = 'Restaurar original'; }, 3000); return; }
    clearTimeout(tm); delete custom[ckey()]; schedule(); render();
  });
  t.append(rep, res);
}

function render() {
  $('wl').textContent = 'Semana ' + week;
  $('wprev').disabled = week <= 1;
  $('wnext').disabled = week >= WEEKS;
  $('title').textContent = NAMES[day];
  $('sub').textContent = prog ? prog.name : FOCUS[day] + (week === 1 ? ' · adaptação' : '') + (week === 6 ? ' · bloco Ramping' : '') + (custom[ckey()] ? ' · editado' : '');
  // Programa do Jeff: Upper e Lower são dias de força; Pull, Push e Legs, de hipertrofia.
  const fk = !prog && FOCUS[day] ? (/força/.test(FOCUS[day]) ? 'forca' : 'hipertrofia') : '';
  $('focus').hidden = !fk;
  if (fk) $('focus').textContent = (fk === 'forca' ? 'Força' : 'Hipertrofia') + ' ⓘ';
  const lg = logs[ckey()], st = CG.dayStatus(lg);
  $('skipnote').hidden = st !== 'skip';
  if (st === 'skip') $('skipnote').textContent = 'Você pulou este treino em ' + new Date(lg.t).toLocaleDateString('pt-BR') + '. Se treinar, é só marcar as séries.';
  $('bskip').hidden = editing || st === 'done';
  $('bskip').textContent = st === 'skip' ? 'Desfazer pulo' : 'Pular treino';
  $('bedit').textContent = editing ? 'Concluir edição' : 'Editar treino';
  $('bedit').className = editing ? 'btn pri' : 'btn';
  $('tip').hidden = editing;
  renderTabs(); renderEdTop(); renderList(); progress();
}

function pickStart() { const n = CG.pickStart(logs, ORDER, WEEKS); if (n) { week = n.week; day = n.day; } }

$('wprev').addEventListener('click', () => { if (week > 1) { week--; render(); } });
$('wnext').addEventListener('click', () => { if (week < WEEKS) { week++; render(); } });
$('bedit').addEventListener('click', () => { editing = !editing; flushNow(); render(); });
$('focus').addEventListener('click', () => CGTips.show(/força/.test(FOCUS[day]) ? 'forca' : 'hipertrofia'));
// Pular: registra o dia como pulado (com a data) e vai para o próximo treino.
$('bskip').addEventListener('click', () => {
  const doc = getDoc();
  if (doc.skip) { delete doc.skip; touch(doc); render(); setStatus('Pulo desfeito'); return; }
  doc.skip = true; doc.t = Date.now(); flushNow();
  const n = CG.nextDay(week, day, ORDER, WEEKS);
  if (n.week === week && n.day === day) { render(); setStatus('Treino pulado'); return; }
  week = n.week; day = n.day; render(); scrollTo(0, 0);
  setStatus('Treino pulado. Próximo: ' + NAMES[day]);
});

$('bexp').addEventListener('click', () => {
  flushNow();
  const json = CG.serializeBackup(logs, custom, programs), name = CG.backupFileName(new Date());
  // No app Android, <a download> não funciona no WebView: grava o arquivo e abre o menu de compartilhar.
  if (window.CGNative) { CGNative.shareBackup(name, json).then(setStatus, () => setStatus('Não consegui exportar')); return; }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setStatus('Backup exportado');
});
$('bimp').addEventListener('click', () => $('fimp').click());
$('fimp').addEventListener('change', () => {
  const f = $('fimp').files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    if (!applyBackup(r.result)) { setStatus('Arquivo inválido'); return; }
    setStatus('Backup importado');
  };
  r.readAsText(f);
  $('fimp').value = '';
});

$('warn').hidden = storageOk;
applyProgram();
pickStart();
render();
setStatus(storageOk ? 'Pronto' : 'Sem armazenamento');
try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* opcional */ }
</script>

<script src="sync.js"></script>

<script src="programs.js"></script>
<script src="update.js"></script>
